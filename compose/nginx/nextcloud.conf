# COIL Project A: HTTPS front door for Nextcloud and the team dashboard
server {
    listen 443 ssl;
    http2 on;
    server_name _;
    ssl_certificate     /etc/nginx/certs/nextcloud.crt;
    ssl_certificate_key /etc/nginx/certs/nextcloud.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 2G;
    client_body_buffer_size 512k;
    proxy_read_timeout 300s;
    proxy_request_buffering off;
    # Team dashboard (Part O)
    location /dashboard/ {
        alias /usr/share/nginx/dashboard/;
        index index.html;
    }
    location = /.well-known/carddav { return 301 $scheme://$http_host/remote.php/dav; }
    location = /.well-known/caldav  { return 301 $scheme://$http_host/remote.php/dav; }
    location / {
        proxy_pass http://app:80;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_buffering off;
    }
}
